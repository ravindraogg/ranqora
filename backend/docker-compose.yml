version: '3.8'

services:
  neo4j:
    image: neo4j:5
    container_name: dataset-neo4j
    ports:
      - "7474:7474" # Browser
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/datasetgraph
      # Enable APOC if needed in the future
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
